[package]
name = "frnsc-prefetch"
version = "0.14.0"
authors = ["Samuel Garcés Marín <samuel.garces@protonmail.com>"]
keywords = ["forensic", "windows", "prefetch", "registry", "cybersecurity"]
categories = ["parsing"]
description = "Pure rust windows prefetch parser implementation"
license = "MIT"
edition = "2021"
repository = "https://github.com/ForensicRS/frnsc-prefetch"
exclude = ["/artifacts", "/img"]

[dependencies]
crc32fast = "1.3.2"
forensic-rs = "0.14"

[dev-dependencies]
# Resolved by the forensic-bootstrap workspace. For CI outside the workspace, switch to the git form
# (the workspace patches it back to the local copy):
#   forensic-testdata = { git = "https://github.com/ForensicRS/forensic-testenv", features = ["cases"] }
forensic-testdata = { workspace = true, features = ["cases"] }
